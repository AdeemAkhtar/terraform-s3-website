name: Terraform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
    

    steps:

      # - name: Get OIDC token
      #   run: |
      #     TOKEN=$(curl -s \
      #       -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
      #       "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')

      #     echo "$TOKEN" | cut -d '.' -f2 | base64 -d | jq

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0

      - name: Terraform Format Check
        run: terraform -chdir=terraform/dev fmt -check

      - name: Terraform Init
        run: terraform -chdir=terraform/dev init

      - name: Terraform Validate
        run: terraform -chdir=terraform/dev validate

      - name: Check GitHub OIDC Environment
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Test AWS Identity
        run: aws sts get-caller-identity
        
      - name: Terraform Plan
        run: terraform -chdir=terraform/dev plan -var="environment=dev"