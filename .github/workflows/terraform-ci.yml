name: Terraform CI
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0
        
      - name: Terraform Format Check
        run: terraform -chdir=terraform/dev fmt

      - name: Terraform Init
        run: terraform -chdir=terraform/dev init
    
      - name: Terraform Validate
        run: terraform -chdir=terraform/dev validate


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC-Role-for-github-actions  }}
          aws-region: us-east-1

      - name: Terraform Plan
        run: terraform -chdir=terraform/dev plan